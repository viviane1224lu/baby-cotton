<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#FFF5E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小棉花">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>小棉花的冒險日記</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: every screen is one of the user's watercolor paintings shown whole on a 16:9 stage (letterboxed on paper); tap spots sit invisibly on the painted objects; UI floats as soft paper chips. Single daylight picture-book look in every theme. */
:root{
  /* Baby Cotton fixed palette: cream #FFF5E5, warm wood #D9A16B, caramel #AC7650; pink #F2B7BF, honey #F5D78B,
     sky #A9C7E4, sage #A9B78C, lavender #C9B6DF only as small touches */
  --paper:#FFF5E5;
  --ink:#5e4a3e;
  --pencil:#97704f;
  --accent:#AC7650;
  --accent-dk:#8A5D3E;
  --leaf:#8f9f6f;
  --line:#E3C9A6;
  --f-zh:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-en:"Caveat","Huninn",cursive;
  color-scheme:light;
}
:root[data-kid="boy"]{--accent:#7E9FC4;--accent-dk:#5D7EA3}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-zh);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
#app{position:relative;height:100%;overflow:hidden;background:var(--paper)}
#stage{position:absolute;overflow:hidden;border-radius:6px;box-shadow:0 10px 40px rgba(94,74,62,.18)}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover;transition:filter 1.2s}
#stage.night #bg{filter:brightness(.68) saturate(.85) sepia(.15) hue-rotate(-10deg)}

/* painted objects you can tap */
.spot{position:absolute;z-index:3;border-radius:18px}
.spot.debug{outline:3px dashed rgba(255,0,90,.8);background:rgba(255,0,90,.12)}
.spot.found::after{content:"✿";position:absolute;right:-6px;top:-10px;color:#fff;font-size:22px;text-shadow:0 0 6px var(--accent),0 0 2px var(--accent)}
.ping{position:absolute;z-index:4;border-radius:50%;pointer-events:none;border:4px solid #fff;box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 45%,transparent),0 0 30px #fff;animation:ping .9s ease-out forwards}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.25);opacity:0}}
.spot:has(.nudge){z-index:6}
.nudge{position:absolute;z-index:4;box-sizing:border-box;border-radius:50%;pointer-events:auto;cursor:pointer;border:5px solid #f97316;box-shadow:0 0 0 5px rgba(255,255,255,.9),0 0 30px 6px rgba(249,115,22,.65);animation:nudge 1s ease-in-out infinite}
.nudge::after{content:"👆";position:absolute;left:58%;top:62%;font-size:46px;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25));animation:poke .8s ease-in-out infinite}
@keyframes poke{50%{transform:translate(-6px,-12px)}}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

/* characters painted by the user, cut from their sheets */
.char{position:absolute;z-index:2;transform:translateX(-50%);cursor:pointer;filter:drop-shadow(0 8px 6px rgba(94,74,62,.18));animation:breathe 2.8s ease-in-out infinite;transition:opacity .5s}
.char.hop{animation:hop .5s ease-in-out 3}
@keyframes breathe{50%{translate:0 -1.2%}}
@keyframes hop{50%{translate:0 -8%}}

/* top bar */
.top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:flex-start;gap:10px;pointer-events:none;
  padding-top:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top>*{pointer-events:auto}
.top>#path,.top>#lvBadge{pointer-events:none}   /* labels only: taps go through to the picture under them */
.chip{background:rgba(255,252,246,.94);border:2px dashed var(--line);border-radius:999px;box-shadow:0 6px 16px rgba(94,74,62,.14)}
#me{display:flex;align-items:center;gap:8px;padding:4px 16px 4px 4px}
#me .av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px}
#me b{display:block;font-size:19px;line-height:1.1}
#me small{font-size:13px;color:var(--pencil)}
.iconbtn{width:52px;height:52px;display:grid;place-items:center;font-size:24px}
.spacer{flex:1}
#path{display:flex;gap:4px;padding:5px 8px}
#path span{font-size:14px;padding:4px 10px;border-radius:999px;color:var(--pencil);white-space:nowrap}
#path span.done{color:#5d7f4d;background:#e5f0dc}
#path span.now{color:#fff;background:var(--accent)}
#path span.lock{opacity:.55}
#lvBadge{font-size:14px;padding:6px 12px;white-space:nowrap;color:var(--ink)}
#lvBadge b{color:var(--accent-dk)}

/* narration */
.say{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;pointer-events:none;max-width:min(860px,calc(100% - 120px));
  background:rgba(255,252,246,.94);border:2px dashed var(--line);border-radius:18px;padding:16px 22px 10px;font-size:clamp(17px,3.2vmin,26px);line-height:1.4;box-shadow:0 8px 24px rgba(94,74,62,.15)}
.who[data-who="旁白"]{background:#a48d7c}.who[data-who="媽媽"]{background:#9C86BE}
.who{position:absolute;top:-15px;left:18px;background:var(--leaf);color:#fff;border-radius:999px;padding:1px 14px;font-size:clamp(13px,2.4vmin,17px)}
.say .xl{pointer-events:auto;margin-left:10px;font:inherit;font-size:16px;padding:4px 12px;border-radius:999px;border:1.5px dashed var(--line);background:#FFF5E5;color:var(--accent-dk);vertical-align:middle;cursor:pointer;white-space:nowrap}
#xlTxt{display:block;font-size:.82em;color:var(--pencil);margin-top:4px}
#replay{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;z-index:6;width:58px;height:58px;font-size:26px;display:grid;place-items:center}

/* word card */
body:has(#card:not([hidden])) #sayBox{z-index:9}
#card{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(94,74,62,.25)}
#card .in{background:#fffdf8;border-radius:14px;padding:16px 26px 18px;text-align:center;box-shadow:0 16px 40px rgba(94,74,62,.3);border:2px dashed var(--line);
  transform:rotate(-1.5deg);animation:cardIn .45s cubic-bezier(.3,1.6,.5,1);max-width:86vw}
@keyframes cardIn{from{scale:.4;opacity:0}}
#card img{display:block;margin:0 auto 8px;max-height:min(34vh,240px);max-width:min(70vw,360px);border-radius:10px}
#card .zy{font-size:clamp(14px,2.6vmin,19px);letter-spacing:.3em;color:var(--pencil);min-height:1em}
#card .zh{font-size:clamp(40px,8.5vmin,66px);line-height:1.05}
#card .en{font-family:var(--f-en);font-weight:700;font-size:clamp(32px,6.5vmin,50px);color:var(--accent);line-height:1}

/* big buttons + overlays */
.go{background:var(--accent);color:#fff;font-size:clamp(20px,4vmin,30px);padding:10px 34px;border-radius:999px;box-shadow:0 6px 0 var(--accent-dk)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-dk)}
.go[disabled]{opacity:.5}
#next{position:absolute;left:50%;bottom:clamp(90px,18vh,130px);transform:translateX(-50%);z-index:7;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{scale:1.07}}
[hidden]{display:none!important}
.overlay{position:absolute;inset:0;z-index:9;display:grid;place-items:center;text-align:center;background:rgba(251,246,238,.9);overflow:auto;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:#fffdf8;border-radius:18px;padding:20px 26px 24px;box-shadow:0 16px 40px rgba(94,74,62,.2);border:2px dashed var(--line);width:min(100%,640px);box-sizing:border-box;min-width:0}
@media (max-width:480px){.panel{padding:16px 12px 20px}}
.panel h2{font-weight:400;font-size:clamp(28px,6vmin,44px);margin:0 0 6px;color:var(--ink)}
.panel .sub{color:var(--pencil);margin-bottom:12px}
.panel img.hero{height:clamp(110px,24vmin,180px);display:block;margin:0 auto 4px}
.form{display:grid;gap:8px;justify-items:center;margin:6px 0 16px;font-size:clamp(17px,3.2vmin,22px)}
.form input{font:inherit;font-size:24px;text-align:center;width:min(80vw,320px);padding:8px 18px;border-radius:999px;border:2px dashed var(--line);background:#fff;color:var(--ink)}
.form input:focus{outline:3px solid var(--accent);outline-offset:2px}
.form .q{margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pick{background:#fff;border:2px dashed var(--line);border-radius:999px;padding:6px 18px;font-size:20px;min-width:64px}
.pick[aria-pressed="true"]{background:var(--accent);color:#fff;border:2px solid var(--accent)}
.pick.boy[aria-pressed="true"]{background:#6fa6d6;border-color:#6fa6d6}
.pick.girl[aria-pressed="true"]{background:#F2B7BF;border-color:#F2B7BF;color:var(--ink)}
.voices{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 8px;align-items:center;width:min(86vw,460px);font-size:17px}
.voices select{font:inherit;font-size:16px;padding:6px 10px;border-radius:12px;border:2px dashed var(--line);background:#fff;color:var(--ink);min-width:0}
.voices .pick{font-size:16px;padding:4px 14px;min-width:0}
.vrow{display:grid;grid-template-columns:3.2em minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center;width:min(90vw,520px);font-size:17px}
.vrow b{font-weight:400}
.vrow select{font:inherit;font-size:15px;padding:5px 6px;border-radius:10px;border:2px dashed var(--line);background:#fff;color:var(--ink);min-width:0}
.vrow .pick{font-size:15px;padding:4px 12px;min-width:0}
#packs{flex-direction:column;align-items:center}
.paintc{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none;cursor:crosshair}
.paintc.mult{mix-blend-mode:multiply}
#stage.paperbg{background:#fffdf8}
#sayBox.top{top:64px;bottom:auto}
#paintBar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:7;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;
  background:rgba(255,252,246,.96);border:2px dashed var(--line);border-radius:22px;padding:8px 10px;max-width:calc(100% - 24px);box-shadow:0 8px 20px rgba(94,74,62,.15)}
#paintBar .gap{width:6px}
.sw{width:clamp(28px,5vmin,40px);height:clamp(28px,5vmin,40px);border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px var(--ink);transform:scale(1.12)}
.tool{min-width:clamp(32px,5.4vmin,44px);height:clamp(32px,5.4vmin,44px);border-radius:14px;background:#fff;border:2px solid var(--line);font-size:clamp(16px,3vmin,22px)}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tool.done{background:#fff3c4}
.sz{display:block;border-radius:50%;background:var(--ink);margin:auto}
.paperthumb{display:block;width:100%;aspect-ratio:16/9;background:#fffdf8;border-bottom:2px dashed var(--line);margin-bottom:4px}
#sayBox.hub{left:4%;top:30%;bottom:auto;transform:none;max-width:30%}
#me .av img{width:100%;height:100%;object-fit:cover;object-position:50% 14%;border-radius:50%;background:#fff}
.pick img{display:block;height:84px;margin:0 auto 2px}

/* hub */
#hubUI{position:absolute;inset:0;z-index:5;pointer-events:none}
#hubUI>*{pointer-events:auto}
.title{position:absolute;top:3%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.title .en{font-family:var(--f-en);font-weight:700;font-size:clamp(30px,6.4vmin,58px);color:var(--ink);line-height:.9}
.title .zh{font-size:clamp(18px,3.6vmin,32px);color:var(--ink);letter-spacing:.08em}
.ribbon{display:inline-block;margin-top:6px;background:#f6e3b8;border-radius:6px;padding:4px 22px;font-size:clamp(15px,2.8vmin,24px);box-shadow:0 4px 10px rgba(94,74,62,.12)}
.ribbon b{color:var(--accent-dk)}
.menu{position:absolute;left:0;right:0;bottom:4%;display:flex;gap:2.2%;justify-content:center}
.menu button{width:19%;aspect-ratio:1.8;border-radius:28px;background:rgba(255,252,246,.95);border:3px dashed var(--line);box-shadow:0 10px 24px rgba(94,74,62,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:clamp(15px,2.9vmin,26px);transition:transform .15s}
.menu button:hover{transform:translateY(-4px)}
.menu .big{font-size:clamp(30px,6vmin,56px);line-height:1}
.menu small{font-size:.65em;color:var(--pencil)}
.menu .m4{background:#fff3d6}
.menu .m1{background:#e8f1fb}.menu .m2{background:#FBEFD0}.menu .m3{background:#eaf3e2}
.rooms{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:8px 0 16px}
.rooms button{border-radius:14px;overflow:hidden;border:2px dashed var(--line);background:#fff;font-size:18px;padding:0 0 6px}
.rooms img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;margin-bottom:4px}
.rooms button[disabled]{opacity:.45;cursor:not-allowed}
.rooms small.lv{display:block;font-size:13px;letter-spacing:1px;margin-top:2px}
.book{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:46vh;overflow:auto;margin:8px 0 16px}
.book span{display:flex;align-items:center;gap:6px;background:#FFF5E5;border:1.5px dashed var(--line);border-radius:999px;padding:3px 12px 3px 3px;font-size:17px}
.book img{width:36px;height:36px;border-radius:50%;object-fit:cover}
.book b{font-family:var(--f-en);color:var(--accent-dk);font-size:20px}
.pano{position:absolute;left:0;top:0;height:100%;aspect-ratio:3/1;transition:transform 9s linear;z-index:1}
.pano img{width:100%;height:100%;display:block}
.pano.go{transform:translateX(-40.7%)}
.char.walkhop{animation:hop .5s ease-in-out infinite}
.petal{position:absolute;top:-8%;width:16px;height:12px;border-radius:60% 0 60% 0;animation:fall linear forwards;z-index:10;pointer-events:none}
@keyframes fall{to{transform:translateY(120vh) rotate(600deg)}}
@media (max-width:640px){#path{display:none} #lvBadge .lvname{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <div id="stage"><img id="bg" alt=""><div id="layer"></div><div id="hubUI" hidden>
    <div class="title"><div class="en">Baby Cotton</div><div class="zh">小棉花的冒險日記</div><div class="ribbon"><b id="ribName"></b>，一起來棉花家玩！</div></div>
    <div class="menu">
      <button class="m1" id="mFree"><span class="big">🏡</span>棉花的家<small>自由探索</small></button>
      <button class="m2" id="mStory"><span class="big">🗺️</span>故事冒險<small>關卡遊戲</small></button>
      <button class="m3" id="mBook"><span class="big">⭐</span>成長紀錄<small>學會的字</small></button>
      <button class="m4" id="mPaint"><span class="big">🎨</span>魔法畫室<small>畫畫、上色</small></button>
    </div>
  </div></div>

  <div class="top">
    <div class="chip" id="me" hidden><span class="av" id="meAv"></span><span><b id="meName"></b><small id="meAge"></small></span></div>
    <button class="chip iconbtn" id="homeBtn" aria-label="回首頁" hidden>🏠</button>
    <div class="chip" id="lvBadge" hidden></div>
    <div class="spacer"></div>
    <div class="chip" id="path" hidden></div>
    <button class="chip iconbtn" id="setBtn" aria-label="設定">⚙️</button>
    <button class="chip iconbtn" id="sndBtn" aria-label="音效">🔊</button>
  </div>

  <div class="say" id="sayBox" hidden><span class="who" id="who">棉花</span><span id="line"></span><button class="xl" id="xlBtn" type="button" hidden></button><span id="xlTxt" hidden></span></div>
  <button class="chip" id="replay" aria-label="再說一次" hidden>🗣️</button>
  <button class="go" id="next" hidden></button>

  <div id="card" hidden><div class="in"><img id="cImg" alt=""><div class="zy" id="cZy"></div><div class="zh" id="cZh"></div><div class="en" id="cEn"></div></div></div>

  <div class="overlay" id="setup">
    <div class="panel">
      <img class="hero" id="setupHero" alt="棉花">
      <h2>Baby Cotton 小棉花的冒險日記</h2>
      <div class="form">
        <div class="q">🌐 Language · 語言</div>
        <div class="row" id="langs"><button class="pick" data-lang="en" aria-pressed="false">English</button><button class="pick" data-lang="tw" aria-pressed="false">繁體＋注音</button><button class="pick" data-lang="cn" aria-pressed="false">简体＋拼音</button></div>
        <label for="nm" id="qName">你叫什麼名字？</label>
        <input id="nm" maxlength="12" placeholder="例如：Vivian" autocomplete="off">
        <div class="q" id="qAge">你幾歲？</div>
        <div class="row" id="ages"></div>
        <div class="q" id="qG">你是男生還是女生？</div>
        <div class="row"><button class="pick boy" data-g="boy" aria-pressed="false"><img id="pkBoy" alt=""><span id="tBoy">男生</span></button><button class="pick girl" data-g="girl" aria-pressed="false"><img id="pkGirl" alt=""><span id="tGirl">女生</span></button></div>
        <div class="q" id="qVoice">聲音（爸爸媽媽可以幫忙選）</div>
        <div class="row" id="packs"></div>
      </div>
      <button class="go" id="play" disabled>準備中…</button>
    </div>
  </div>

  <div class="overlay" id="free" hidden><div class="panel"><h2 id="freeTitle">棉花的家</h2><div class="sub" id="freeSub">想去哪個房間玩？</div><div class="rooms" id="roomList"></div><button class="go" data-close>回首頁</button></div></div>
  <div class="overlay" id="paintPick" hidden><div class="panel"><h2 id="paintTitle">魔法畫室</h2><div class="sub" id="paintSub">想畫在哪裡？</div><div class="rooms" id="paintList"></div><button class="go" data-close>回首頁</button></div></div>
  <div id="paintBar" hidden></div>
  <div class="overlay" id="bookPanel" hidden><div class="panel"><h2 id="bookTitle">成長紀錄</h2><div class="sub" id="bookSub"></div><div class="book" id="bookList"></div><button class="go" data-close>回首頁</button></div></div>
  <div class="overlay" id="done" hidden><div class="panel"><img class="hero" id="doneHero" alt="棉花"><h2 id="doneTitle"></h2><div class="sub" id="doneSub"></div><button class="go" id="doneBtn">回首頁</button></div></div>
</div>

<script>

function toEn(t){ const nm=N(), key=String(t).split(nm).join("{n}"); let e=EN_FIXED[key];
  if(!e) for(const [re,f] of EN_PAT){ const m=key.match(re); if(m){ e=f(m); break; } }
  return e?e.split("{n}").join(nm):null; }

function enChunks(t){ const nm=N(), out=[];
  String(t).split(nm).forEach((part,i)=>{ if(i) out.push(nm);
    part.split(/(?<=[.!?])\s+/).forEach(c=>{ c=c.replace(/^[,\s]+|[,\s]+$/g,""); if(c&&!/^[.!?,\s]+$/.test(c)) out.push(c); }); });
  return out; }

function addPlayer(cx,bottom,h){ if(!ME.g||!SPR[ME.g]) return; const el=addChar("me",ME.g,cx,bottom,h); el.id="pl";
  el.onclick=()=>{ cheer(); if(quiz) return; showCard("me",el.src); }; }
function addChar(key,sprite,cx,bottom,h){ const s=key==="cotton"?(anyPose(sprite)||SPR[sprite]):SPR[sprite]; const el=document.createElement("img");
  el.className="char"; el.src=s.url; el.alt=key==="me"?N():W[key][0]; el.dataset.w=key;
  Object.assign(el.style,{left:cx+"%",bottom:bottom+"%",height:h+"%"}); el.dataset.h=h; if(key==="cotton") fitCot(el,s); layer.appendChild(el); return el; }
function fitCot(el,s){ const asp=s.w/s.h; el.style.height=(+el.dataset.h*.82*Math.min(1,.95/asp))+"%"; }   // .82: normal bunny size, not a giant

function showHub(){
  clearStage(); mode="hub"; OUTFIT="home"; $("bg").src="img/hub.webp"; $("hubUI").hidden=false; $("homeBtn").hidden=true;
  applyLangUI(); $("sayBox").classList.add("hub");
  const c=addChar("cotton","stand",54,22,40); c.id="cot"; c.classList.add("hop");
  c.onclick=()=>{ swapCotton(); say(`嗨，${N()}！我是棉花，歡迎來我家玩！`); };
  hubT=setInterval(()=>swapCotton(Math.random()<.2?["sleep"]:null),6000);
  say(`嗨，${N()}！我是棉花！來看看我的家，認識好多好多東西吧！`);
}
let mode="hub", room=null, found=new Set(), quiz=null;
// rooms open one by one: the next room unlocks once this room's level 1 is passed (or the story has reached it)
const passedRoom=i=>i<PROG.story||(((PROG.lv||{})[ROOMS[i].id])||1)>=2;
const roomOpen=i=>i===0||i<=PROG.story||passedRoom(i-1);
function pathChips(){ $("path").innerHTML=ROOMS.map((r,i)=>`<span class="${r===room?"now":passedRoom(i)?"done":!roomOpen(i)?"lock":""}">${roomOpen(i)?"":"🔒 "}${roomName(r.name)}</span>`).join(""); $("path").hidden=false; }

function openRoom(i,m){
  clearStage(); mode=m; room=ROOMS[i]; quizDone=false; quiz=null; OUTFIT=room.outfit||"home"; found=new Set(); quiz=null; $("homeBtn").hidden=false;
  $("bg").src=room.img;
  roomSpots(room).forEach(s=>{ const b=document.createElement("button"); b.className="spot"; b.dataset.w=s[0];
    b.setAttribute("aria-label",W[s[0]][0]); Object.assign(b.style,{left:s[1]+"%",top:s[2]+"%",width:s[3]+"%",height:s[4]+"%"});
    b.onclick=()=>tapSpot(s,b); layer.appendChild(b); });
  room.chars.forEach(([k,cx,bot,h])=>{ const el=addChar(k,k,cx,bot,h); el.onclick=()=>tapChar(k,el); });
  if(room.cotton){ const [cx,bot,h,p]=room.cotton; const el=addChar("cotton",p,cx,bot,h); el.id="cot"; el.onclick=()=>tapChar("cotton",el); }
  pathChips(); lvShow();
  if(mode==="free"&&LV(room)===MAXLV){ say("聲音小偵探！聽聽看，找出是哪一樣東西！","旁白"); afterSpeech(()=>{ if(!quiz&&!quizDone&&mode==="free") startQuiz(); },700); return; }
  say(room.intro(N()), room.who||"棉花"); idle();
  // front yard: after "who's home?", Cotton hops out by itself (tapping the door first still works too)
  if(room.id==="door"&&mode==="free"){ const me=room, run=storyRun;
    const wait=()=>{ if(room!==me||mode!=="free"||run!==storyRun||$("cot")) return;   // left the yard, or Cotton is already out
      if(talking>0||!$("card").hidden) return setTimeout(wait,800);                   // let the current line finish first
      doorCotton(); };
    setTimeout(wait,1200); }
}
function doorCotton(){ const el=addChar("cotton","hop",61,2,38); el.id="cot"; el.classList.add("hop"); el.onclick=()=>tapChar("cotton",el);
  say(`早安，${N()}！我是棉花！媽媽說今天要帶我出去玩！`); }
function ping(el){ const r=el.getBoundingClientRect(), s=$("stage").getBoundingClientRect(), d=Math.max(r.width,r.height)*1.1;
  const p=document.createElement("div"); p.className="ping"; Object.assign(p.style,{width:d+"px",height:d+"px",left:(r.left-s.left+r.width/2-d/2)+"px",top:(r.top-s.top+r.height/2-d/2)+"px"});
  layer.appendChild(p); setTimeout(()=>p.remove(),900); }
function lvShow(){ const b=$("lvBadge"); if(mode!=="free"||!room||!ROOMS.includes(room)){ b.hidden=true; return; }
  const lv=LV(room), E=LANG()==="en";
  const name=E?`Level ${lv}`:show(`第 ${lv} 關`)+` <span class="lvname">${show(LEVEL_NAME[lv])}</span>`;
  const prog=quiz?(E?" · Quiz ":" · "+show("考試")+" ")+`<b>${quiz.total-quiz.left.length}/${quiz.total}</b>`:lv<MAXLV?` · <b>${found.size}/${countable()}</b>`:"";
  b.innerHTML=`${stars(room)} ${name}${prog}`; b.hidden=false; }
function countable(){ return roomSpots(room).length+room.chars.length; }
function tapSpot(s,b){
  if(mode==="story") return storyTap(s[0],b,()=>storySpotSrc(s));
  idle(); ping(b);
  if(quiz){ return answer(s[0],b); }
  showCard(s[0],thumb(room.id,s)); b.classList.add("found"); found.add(s[0]); swapCotton(); lvShow();
  if(room.id==="door"&&s[0]==="door"&&!$("cot")){ afterSpeech(()=>{ if(!$("cot")) doorCotton(); },300,true); }
  check();
}
function tapChar(k,el){ if(mode==="story") return storyTap(k,el,()=>k==="cotton"?el.src:SPR[k].url);
  idle(); el.classList.remove("hop"); el.offsetWidth; el.classList.add("hop");
  if(quiz) return answer(k,el);
  if(k==="cotton"){ swapCotton(); showCard(k,el.src,"棉花"); } else showCard(k,SPR[k].url,k==="mom"?"媽媽":"旁白");
  if(k!=="cotton"){ found.add(k); } lvShow(); check(); }
function check(){ if(mode==="free"&&found.size<countable()) return; if(found.size<countable()) return;
  if(quiz||quizDone) return;
  afterSpeech(()=>{ if(!quiz&&!quizDone) startQuiz(); },900); }
// 找完全部之後：考考你，考過就解鎖下一關
let quizDone=false;
function startQuiz(){ const keys=[...new Set(roomSpots(room).map(s=>s[0]))].sort(()=>Math.random()-.5).slice(0,[0,8,10,12,10][LV(room)]); quiz={left:keys,total:keys.length}; askQ(); }
function askQ(){ if(!quiz) return; if(!quiz.left.length){ quiz=null; quizDone=true; lvShow(); return roomDone(); } quiz.now=quiz.left[0]; lvShow(); askNow(); }
// 第 3 關：用另一種語言問（中文模式問英文，English 模式問中文）；第 4 關：只給聲音提示
function askNow(again){ const k=quiz.now, [zh,,en,fact,,factEn]=W[k], lv=LV(room), E=LANG()==="en";
  if(lv===3){ if(E) sayAs(`${N()}，${zh}在哪裡？`,[[`${N()}，${zh}在哪裡？點點看！`,"zh"]]);
              else { const q=`${N()}, where is the ${en.toLowerCase()}?`; sayAs(q,[[q,"en"]]); } return; }
  if(lv===4){ const first=again?(E?"Listen again!":"再聽一次！"):(E?"Guess what it is!":"猜猜看，是什麼？");
    sayAs("🔊 "+(E?first:show(first)),E?[[first,"en"],[factEn,"en"]]:[[first,"zh"],[fact,"zh"]]); return; }
  if(E){ sayAs(`${N()}, where is ${zh}?`,[[`${N()}, where is`,"en"],[zh,"zh"]]); return; }
  // Chinese mode mirrors it: ask with the English word ("Vivian，Car 在哪裡？") so Chinese speakers practise English
  sayAs(`${N()}，${en} ${show("在哪裡？")}`,[[`${N()}，`,"zh"],[en,"en"],["在哪裡？點點看！","zh"]]); }
function answer(k,el){ if(k===quiz.now){ yay(); quiz.left.shift(); const E=LANG()==="en"; $("line").textContent=E?`Yes! That's ${W[k][0]}!`:show(`答對了！這是${W[k][0]}！`); if(!E) $("line").textContent=`${show("答對了！這是")} ${W[k][2]}！`; speak(E?[["Yes! That's","en"],[W[k][0],"zh"]]:[["答對了！這是","zh"],[W[k][2],"en"]],"旁白"); afterSpeech(askQ,700); }
  else { oops(); const lv=LV(room), E=LANG()==="en";
    if(lv===4) return askNow(true);
    if(lv===3){ if(E){ const z=`這是${W[k][0]}喔。再找找${W[quiz.now][0]}在哪裡？`; return sayAs(z,[[z,"zh"]]); }
      const q=`That's the ${W[k][2].toLowerCase()}. Where is the ${W[quiz.now][2].toLowerCase()}?`; return sayAs(q,[[q,"en"]]); }
    if(E){ const a=W[k][0], b=W[quiz.now][0]; return sayAs(`That's ${a}. Where is ${b}?`,[["That's","en"],[W[k][0],"zh"],["Where is","en"],[W[quiz.now][0],"zh"]]); }
    const a=W[k][2], b=W[quiz.now][2]; sayAs(`${show("這是")} ${a}。${b} ${show("在哪裡？")}`,[["這是","zh"],[a,"en"],[b,"en"],["在哪裡？","zh"]]); } }
function roomDone(){
  yay(); petals(); stopNudge();
  const i=ROOMS.indexOf(room);
  if(mode==="story"){
    if(PROG.story===i) PROG.story=i+1; save(); pathChips();
    if(i===ROOMS.length-1){ say(`${N()}好棒！今天和棉花一起去了好多地方！`); afterSpeech(()=>finale(),800); return; }
    say(`${N()}好棒！${room.name}的東西都找到了！下一站：${ROOMS[i+1].name}！`);
    $("next").textContent=`下一站：${ROOMS[i+1].name} ▶`; $("next").hidden=false; $("next").onclick=()=>{ ding(); openRoom(i+1,"story"); };
  } else {
    say(`${N()}好棒！${room.name}的東西都找到了！`);
    const lv=LV(room);
    if(lv<MAXLV){ PROG.lv=PROG.lv||{}; PROG.lv[room.id]=lv+1; save();
      afterSpeech(()=>{ cheer(); say(`解鎖新關卡！${room.name}有更多東西可以找囉！`); },700);
      $("next").textContent=LANG()==="en"?"Next level ▶":show(`下一關：${LEVEL_NAME[lv+1]} ▶`); $("next").onclick=()=>{ ding(); openRoom(i,"free"); };
    } else {
      afterSpeech(()=>say("全部過關了！你是棉花冒險家！"),700);
      $("next").textContent=LANG()==="en"?"Back to Cotton's home":show("回到棉花的家"); $("next").onclick=()=>{ ding(); showFree(); };
    }
    $("next").hidden=false;
  }
}
function finale(){ $("doneHero").src=SPR.hug.url; $("doneTitle").textContent=`${N()}，故事冒險完成！`;
  $("doneSub").textContent=`你和棉花一起學會了 ${PROG.words.length} 個字。下一次，我們去森林尋寶！`; $("done").hidden=false;
  speak([[`${N()}好棒！故事冒險完成！下一次，我們去森林尋寶！`,"zh"]]); }
$("doneBtn").onclick=()=>{ $("done").hidden=true; showHub(); };

const STORY=/*STORY*/[

  {id:"bath",name:"浴室",room:"bath",

          ["banana","媽媽","{n}，幫棉花找到香蕉！","棉花","香蕉甜甜的，好好吃！","eat"]]},

   intro:[["棉花","吃飽了，我們來玩玩具！"]],

          ["swing","媽媽","{n}，幫棉花找到盪鞦韆！","棉花","盪高高，飛起來囉！","happy"],
          ["squirrel","棉花","樹上有誰在吃果子？","棉花","是松鼠！你好，松鼠！","happy"]]},
  {id:"bedroom",name:"房間",room:"bedroom",

   tasks:[["pillow","媽媽","{n}，幫棉花找到枕頭！","棉花","枕頭軟軟的，好舒服！","happy"],
          ["teddy","棉花","我要抱小熊睡覺！{n}，小熊在哪裡？","棉花","小熊，我們一起睡覺吧！","hug"],
          ["bed","媽媽","{n}，棉花的床在哪裡？","棉花","我躺好了，晚安！","sleep"]]},

const STORY_END=["旁白","玩了一整天，棉花好累喔。晚安，棉花！晚安，{n}！"];
const WALK_SPOT=["school",80,28,17,34];
let sc=null, target=null, targetDone=null;
const T=t=>t.split("{n}").join(N());
const until=()=>new Promise(r=>{ const p=lastSpeech; p.then(()=>setTimeout(r,500)); });
async function line(who,text){ say(T(text),who); await until(); }
function storySpotSrc(s){ if(sc.walk) return thumb("walk",s); if(sc.room) return thumb(sc.room,s);
  const k=s[0]; if(SPR[k]) return SPR[k].url; if(k==="cotton") return SPR.stand.url;
  const [,x,y,w,h]=s, im=IMG.family, iw=im.naturalWidth, ih=im.naturalHeight, vis=iw*9/16, off=(ih-vis)/2;
  const c=document.createElement("canvas"); c.width=w/100*iw; c.height=h/100*vis;
  c.getContext("2d").drawImage(im,x/100*iw,off+y/100*vis,c.width,c.height,0,0,c.width,c.height); return c.toDataURL("image/jpeg",.85); }
const roomName=n=>LANG()==="en"?(ROOM_EN[n]||n):LANG()==="cn"?toS(n):n;
function storyChips(i){ $("path").innerHTML=STORY.map((x,j)=>`<span class="${j<i?"done":j===i?"now":"lock"}">${j>i?"🔒 ":""}${roomName(x.name)}</span>`).join(""); $("path").hidden=false; }
function spotEl(k,x,y,w,h,parent){ const b=document.createElement("button"); b.className="spot"; b.dataset.w=k; b.setAttribute("aria-label",W[k][0]);
  Object.assign(b.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"}); b.onclick=()=>tapSpot([k,x,y,w,h],b); (parent||layer).appendChild(b); return b; }
let storyRun=0;
async function playStory(i){
  clearStage(); mode="story"; OUTFIT="home"; sc=STORY[i]; target=null; $("homeBtn").hidden=false; storyChips(i);
  const me=++storyRun, alive=()=>me===storyRun&&mode==="story";
  const R=sc.room&&ROOMS.find(r=>r.id===sc.room); room=R||{id:sc.id,spots:[],chars:[]};
  $("stage").classList.toggle("night",sc.id==="bedroom");
  if(sc.walk){
    $("bg").src="img/walk.webp"; $("bg").style.visibility="hidden";
    const pano=document.createElement("div"); pano.className="pano"; pano.innerHTML=`<img src="img/walk.webp" alt="">`; layer.appendChild(pano);
    spotEl(...WALK_SPOT,pano);
    const m=addChar("mom","mom",34,4,44); m.onclick=()=>tapChar("mom",m);
    const c=addChar("cotton","hop",50,4,30); c.id="cot"; c.classList.add("walkhop"); c.onclick=()=>tapChar("cotton",c);
    await line(...sc.intro[0]); if(!alive()) return;
    pano.style.transform=`translateX(${-(pano.offsetWidth-$("stage").offsetWidth)}px)`; await new Promise(r=>setTimeout(r,9000)); if(!alive()) return;
    c.classList.remove("walkhop"); c.src=anyPose("stand").url;
  } else {
    $("bg").style.visibility=""; $("bg").src=R?R.img:sc.bg;
    (R?roomSpots(R):sc.spots).forEach(s=>spotEl(...s));
    if(R){ R.chars.forEach(([k,cx,bot,h])=>{ const el=addChar(k,k,cx,bot,h); el.onclick=()=>tapChar(k,el); });
      if(R.cotton){ const [cx,bot,h,p]=R.cotton; const el=addChar("cotton",p,cx,bot,h); el.id="cot"; el.onclick=()=>tapChar("cotton",el); } }
    for(const l of sc.intro){ await line(...l); if(!alive()) return; }
  }
  for(const [k,askWho,ask,doneWho,done,pose] of sc.tasks){
    if(!alive()) return;
    target=k; say(T(ask),askWho); storyNudge();
    await new Promise(r=>targetDone=r); if(!alive()) return;
    target=null; stopNudge();
    if(sc.id==="door"&&!$("cot")){ const el=addChar("cotton","hop",61,2,38); el.id="cot"; el.onclick=()=>tapChar("cotton",el); }
    if(pose) swapCotton([pose]); else swapCotton();
    await line(doneWho,done);
  }
  if(!alive()) return;
  if(PROG.story<=i){ PROG.story=i+1; save(); } storyChips(i+1); yay(); petals();
  if(i===STORY.length-1){ await line(...STORY_END); if(alive()) storyFinale(); return; }
  $("next").textContent=LANG()==="en"?`Next: ${roomName(STORY[i+1].name)} ▶`:show(`下一站：${STORY[i+1].name} ▶`); $("next").hidden=false; $("next").onclick=()=>{ ding(); playStory(i+1); };
}
async function storyTap(k,el,src){
  ping(el); if(el.classList.contains("char")){ el.classList.remove("hop"); el.offsetWidth; el.classList.add("hop"); }
  if(!target) return;
  if(k===target){ const r=targetDone; target=null; el.classList.add("found"); yay(); showCard(k,src()); await until(); targetDone=null; r&&r(); }
  else if(W[k]){ oops(); say(`這是${W[k][0]}喔。再找找${W[target][0]}在哪裡？`,"旁白"); storyNudge(); }
}
// after a while, a ring shows where the answer is
function storyNudge(){ stopNudge(); nudgeT=setTimeout(()=>{ if(!target) return;
  const b=layer.querySelector(`[data-w="${target}"]`); if(!b) return;
  const r=b.getBoundingClientRect(), s=$("stage").getBoundingClientRect(), d=Math.min(170,Math.max(80,Math.min(r.width,r.height)));
  nudgeEl=document.createElement("div"); nudgeEl.className="nudge"; Object.assign(nudgeEl.style,{width:d+"px",height:d+"px",left:(r.left-s.left+r.width/2-d/2)+"px",top:(r.top-s.top+r.height/2-d/2)+"px"});
  layer.appendChild(nudgeEl); },9000); }
function storyFinale(){ $("doneHero").src=(SPR.sleep||SPR.hug).url; $("doneTitle").textContent=LANG()==="en"?"Good night, Cotton!":show("晚安，棉花！");
  $("doneSub").textContent=show(`${N()}好棒！你陪棉花過了開心的一天！`); $("done").hidden=false; }


// ================= 魔法畫室 =================
// Draw on white paper, or colour 棉花's world: on a scene the strokes use the "color" blend,
// so the watercolour texture stays and only the colour changes (a pink sofa, a purple sky…).
// the 8 colours on the Baby Cotton colour card, with the plain names young children use
const PALETTE=["red","pink","yellow","green","blue","purple","brown","white"];
const HEX={red:"#C94A44",pink:"#F2B7BF",yellow:"#F5D78B",green:"#A9B78C",blue:"#A9C7E4",purple:"#C9B6DF",brown:"#AC7650",white:"#FFFCF6",orange:"#ff9f43",black:"#343a40",skyblue:"#8fd3fe",lightgreen:"#b2f2bb",navy:"#1c3f94",gray:"#adb5bd",gold:"#e8b10e",peach:"#ffc9a0"};
const SIZES=[1.2,2.6,5];
let pen={color:"red",size:1,erase:false}, strokes=[], drawing=null;
function showPaintPick(){ clearStage(); showHubBg();
  $("paintList").innerHTML=[`<button data-p="paper"><span class="paperthumb"></span>${show("白紙")}</button>`,...ROOMS.map(r=>`<button data-p="${r.id}"><img src="${r.img}" alt="">${roomName(r.name)}</button>`)].join("");
  $("paintPick").hidden=false; say(`${N()}，想畫在哪裡？`,"棉花"); }
$("paintList").addEventListener("click",e=>{ const b=e.target.closest("[data-p]"); if(!b) return; $("paintPick").hidden=true; ding(); openPaint(b.dataset.p); });
const LINEART={};
function blur(src,w,h,r){ const out=new Float32Array(w*h), tmp=new Float32Array(w*h), n=2*r+1;
  for(let y=0;y<h;y++){ let s=0; for(let x=-r;x<=r;x++) s+=src[y*w+Math.min(w-1,Math.max(0,x))];
    for(let x=0;x<w;x++){ tmp[y*w+x]=s/n; s+=src[y*w+Math.min(w-1,x+r+1)]-src[y*w+Math.max(0,x-r)]; } }
  for(let x=0;x<w;x++){ let s=0; for(let y=-r;y<=r;y++) s+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for(let y=0;y<h;y++){ out[y*w+x]=s/n; s+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x]; } }
  return out; }
function lineArt(id){ if(LINEART[id]) return LINEART[id];
  const im=IMG[id]; const w=1400, h=Math.round(w*im.naturalHeight/im.naturalWidth);
  const c=document.createElement("canvas"); c.width=w; c.height=h; const x=c.getContext("2d"); x.drawImage(im,0,0,w,h);
  const d=x.getImageData(0,0,w,h), g=new Float32Array(w*h);
  for(let i=0;i<w*h;i++) g[i]=.3*d.data[i*4]+.59*d.data[i*4+1]+.11*d.data[i*4+2];
  const a=blur(g,w,h,1), b=blur(g,w,h,4);
  for(let i=0;i<w*h;i++){ const v=a[i]-b[i]; const k=v<-7?Math.max(30,255+v*9):255; d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=k; d.data[i*4+3]=255; }
  x.putImageData(d,0,0); return LINEART[id]=c.toDataURL("image/png"); }
function openPaint(page){
  clearStage(); mode="paint"; strokes=[]; $("homeBtn").hidden=false;
  const R=ROOMS.find(r=>r.id===page);
  if(R){ $("bg").src=lineArt(R.id); } else { $("bg").style.visibility="hidden"; $("stage").classList.add("paperbg"); }
  const c=document.createElement("canvas"); c.id="pc"; c.className="paintc"+(R?" mult":""); layer.appendChild(c);
  sizeCanvas(); bindPaint(c); drawBar(); $("paintBar").hidden=false; $("sayBox").classList.add("top");
  say(R?"選一個顏色，幫棉花的家塗上顏色吧！":"選一個顏色，畫畫看吧！","棉花"); }
function sizeCanvas(){ const c=$("pc"); if(!c) return; const r=$("stage").getBoundingClientRect(), d=window.devicePixelRatio||1;
  c.width=Math.round(r.width*d); c.height=Math.round(r.height*d); redraw(); }
function redraw(){ const c=$("pc"); if(!c) return; const x=c.getContext("2d"); x.clearRect(0,0,c.width,c.height); strokes.forEach(st=>drawStroke(x,c,st,0)); }
function drawStroke(x,c,st,from){ x.save(); x.globalCompositeOperation=st.erase?"destination-out":"source-over";
  x.strokeStyle=x.fillStyle=HEX[st.color]; x.lineCap=x.lineJoin="round"; x.lineWidth=SIZES[st.size]/100*c.width;
  const P=([a,b])=>[a*c.width,b*c.height], p=st.pts;
  if(p.length===1){ const [u,v]=P(p[0]); x.beginPath(); x.arc(u,v,x.lineWidth/2,0,7); x.fill(); }
  else { x.beginPath(); x.moveTo(...P(p[Math.max(0,from-1)])); for(let i=Math.max(1,from);i<p.length;i++) x.lineTo(...P(p[i])); x.stroke(); }
  x.restore(); }
function bindPaint(c){
  const pt=e=>{ const r=c.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
  c.addEventListener("pointerdown",e=>{ e.preventDefault(); c.setPointerCapture(e.pointerId);
    drawing={color:pen.color,size:pen.size,erase:pen.erase,pts:[pt(e)]}; strokes.push(drawing); drawStroke(c.getContext("2d"),c,drawing,0); });
  c.addEventListener("pointermove",e=>{ if(!drawing) return; drawing.pts.push(pt(e)); drawStroke(c.getContext("2d"),c,drawing,drawing.pts.length-1); });
  const end=()=>{ drawing=null; }; c.addEventListener("pointerup",end); c.addEventListener("pointercancel",end); }
function drawBar(){
  $("paintBar").innerHTML=PALETTE.map(k=>`<button class="sw" data-c="${k}" style="background:${HEX[k]}" aria-label="${W[k][0]}" aria-pressed="${!pen.erase&&pen.color===k}"></button>`).join("")
   +`<span class="gap"></span>`+SIZES.map((s,i)=>`<button class="tool" data-s="${i}" aria-label="筆的粗細 ${i+1}" aria-pressed="${!pen.erase&&pen.size===i}"><span class="sz" style="width:${6+i*7}px;height:${6+i*7}px"></span></button>`).join("")
   +`<button class="tool" data-t="erase" aria-label="橡皮擦" aria-pressed="${pen.erase}">🧽</button><button class="tool" data-t="undo" aria-label="上一步">↩️</button><button class="tool" data-t="clear" aria-label="全部擦掉">🗑️</button><button class="tool done" data-t="done" aria-label="完成">⭐</button>`; }
$("paintBar").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.c){ pen.color=b.dataset.c; pen.erase=false; const [zh,,en]=W[pen.color]; speak(LANG()==="en"?[[en,"en"],[zh,"zh"]]:[[zh,"zh"],[en,"en"]],"旁白");
    $("line").textContent=LANG()==="en"?`${en}  ${W[pen.color][0]} ${W[pen.color][4]}`:LANG()==="cn"?`${W[pen.color][6]}  ${en}`:`${zh}  ${en}`; }
  else if(b.dataset.s){ pen.size=+b.dataset.s; pen.erase=false; ding(); }
  else if(b.dataset.t==="erase"){ pen.erase=!pen.erase; ding(); }
  else if(b.dataset.t==="undo"){ strokes.pop(); redraw(); ding(); }
  else if(b.dataset.t==="clear"){ strokes=[]; redraw(); oops(); }
  else if(b.dataset.t==="done"){ yay(); petals(); swapCotton(); say("哇！這是你創造的彩色世界，好特別呀！","棉花"); }
  drawBar(); });

// gentle nudge toward something not yet tapped (for little ones who wait)
let nudgeT=null, nudgeEl=null;
function stopNudge(){ clearTimeout(nudgeT); nudgeEl&&nudgeEl.remove(); nudgeEl=null; }
function idle(){ stopNudge(); if(mode==="hub") return; const fire=()=>{
  // never cut Cotton off: wait until nothing is being said and the picture card is closed
  if(talking>0||!$("card").hidden||Date.now()-quietSince<8000){ nudgeT=setTimeout(fire,2000); return; }
  // only point at things a finger can actually reach (not hidden under the top bar)
  const left=[...layer.querySelectorAll(".spot:not(.found)")].filter(b=>{ const r=b.getBoundingClientRect(), el=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2); return el&&(el===b||b.contains(el)); });
  if(!left.length||quiz) return;
  const b=left[Math.floor(Math.random()*left.length)], r=b.getBoundingClientRect(), d=Math.min(150,Math.max(80,Math.min(r.width,r.height)));
  // the ring lives inside the object, so it stays on it even if the screen turns or resizes
  nudgeEl=document.createElement("div"); nudgeEl.className="nudge";
  // exact pixel position at the middle of the object (works the same in every browser, LINE included)
  Object.assign(nudgeEl.style,{width:d+"px",height:d+"px",left:(b.clientWidth-d)/2+"px",top:(b.clientHeight-d)/2+"px"});
  b.appendChild(nudgeEl); say(`${N()}，點點看這裡！`,"棉花"); }; nudgeT=setTimeout(fire,12000); }

// ---------- hub menu ----------
function showFree(){ clearStage(); showHubBg(); $("roomList").innerHTML=ROOMS.map((r,i)=>`<button data-i="${i}" ${roomOpen(i)?"":"disabled"}><img src="${r.img}" alt="">${roomOpen(i)?"":"🔒 "}${roomName(r.name)}<small class="lv">${stars(r)}</small></button>`).join(""); $("free").hidden=false; say(`${N()}，想去哪個房間玩？`); }
function showHubBg(){ $("bg").src="img/hub.webp"; $("homeBtn").hidden=true; }
$("roomList").addEventListener("click",e=>{ const b=e.target.closest("[data-i]"); if(!b||b.disabled||!roomOpen(+b.dataset.i)) return; $("free").hidden=true; ding(); openRoom(+b.dataset.i,"free"); });
$("mPaint").onclick=()=>{ ding(); showPaintPick(); };
$("mFree").onclick=()=>{ ding(); showFree(); };
$("mStory").onclick=()=>{ ding(); playStory(PROG.story>=STORY.length?0:PROG.story); };
$("mBook").onclick=()=>{ ding(); const ks=PROG.words.filter(k=>W[k]);
  const st=Math.min(PROG.story+1,ROOMS.length);
  if(LANG()==="en"){ $("bookTitle").textContent=`${N()}'s Words`; $("bookSub").textContent=ks.length?`${ks.length} words learned · story stop ${st}`:"No words yet. Let's go explore!"; }
  else { $("bookTitle").textContent=show(`${N()}的成長紀錄`); $("bookSub").textContent=show(ks.length?`已經學會 ${ks.length} 個字，故事冒險走到第 ${st} 站`:"還沒有學會的字，快去探險吧！"); }
  $("bookList").innerHTML=ks.map(k=>{ let src=""; for(const r of ROOMS){ const s=r.spots.find(s=>s[0]===k); if(s){src=thumb(r.id,s);break;} } if(!src&&SPR[k]) src=SPR[k].url; if(!src&&k==="cotton") src=SPR.stand.url;
    return `<span><img src="${src}" alt="">${W[k][0]}<b>${W[k][2]}</b></span>`; }).join("");
  $("bookPanel").hidden=false; };
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>{ b.closest(".overlay").hidden=true; showHub(); });
$("homeBtn").onclick=()=>{ ding(); try{speechSynthesis.cancel();}catch(e){} showHub(); };

try{ pick(); speechSynthesis.onvoiceschanged=pick; }catch(e){}
if(ME.age>5) ME.age=5; if(ME.age<1) ME.age=1;
$("ages").innerHTML=[1,2,3,4,5].map(a=>`<button class="pick" data-a="${a}" aria-pressed="${ME.age===a}">${ageTxt(a)}</button>`).join("");

applyKid();
$("ages").addEventListener("click",e=>{ const b=e.target.closest("[data-a]"); if(!b) return; ME.age=+b.dataset.a; ding(); $("ages").querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{ ME.g=b.dataset.g; applyKid(); ding(); });

applyLangUI();
$("play").onclick=()=>{ if($("play").disabled) return; unlockAudio(); muted=false; $("sndBtn").textContent="🔊"; ME.name=$("nm").value.trim().slice(0,12); save();
  if(ME.g&&SPR[ME.g]) $("meAv").innerHTML=`<img src="${SPR[ME.g].url}" alt="">`; else $("meAv").textContent=[...N()][0].toUpperCase(); $("meName").textContent=N(); $("meAge").textContent=ageTxt(ME.age); $("me").hidden=false;
  $("setup").hidden=true; $("replay").hidden=false; yay(); showHub(); };

function petals(){ const cs=["#F2B7BF","#F5D78B","#A9B78C","#C9B6DF","#A9C7E4"]; for(let i=0;i<26;i++){ const p=document.createElement("div"); p.className="petal";
  p.style.background=cs[i%4]; p.style.left=Math.random()*100+"%"; p.style.animationDuration=(2+Math.random()*1.8)+"s"; p.style.animationDelay=Math.random()*.6+"s";
  $("app").appendChild(p); setTimeout(()=>p.remove(),4500); } }

$("bg").src="img/hub.webp";
loadAllVoices();
loadAll().then(()=>{ $("setupHero").src=SPR.happy.url; $("pkBoy").src=SPR.boy.url; $("pkGirl").src=SPR.girl.url; $("play").disabled=false; playState="start"; playTxt(); })
  .catch(()=>{ $("play").disabled=false; playState="start"; playTxt(); });
// Sound check for parents: open the link with ?debug to see why there is no sound (shown only then)
if(/[?&]debug/.test(location.search)){ const D={clips:0,tts:0,fail:0,err:[]}, box=document.createElement("div");
  box.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#222;color:#fff;font:14px/1.5 monospace;padding:10px;border-radius:10px;white-space:pre-wrap";
  document.body.appendChild(box); const note=m=>{ D.err.push(String(m).slice(0,120)); if(D.err.length>4) D.err.shift(); };
  addEventListener("error",e=>note(e.message)); addEventListener("unhandledrejection",e=>note(e.reason&&(e.reason.message||e.reason)));
  const pc=playClip; playClip=function(...a){ D.clips++; return pc.apply(this,a); };
  const bs=browserSay; browserSay=function(...a){ D.tts++; return bs.apply(this,a); };
  const gc=getClip; getClip=async function(...a){ try{ const c=await gc.apply(this,a); if(!c) D.fail++; return c; }catch(e){ D.fail++; note("decode: "+(e&&(e.message||e.name)||e)); throw e; } };
  setInterval(()=>{ box.textContent=`聲音檢查 Sound check\n聲音引擎 audio: ${ac?ac.state+" "+ac.sampleRate+"Hz":"還沒開 not started"}   靜音 muted: ${muted}\n播出配音 clips: ${D.clips}   電腦語音 tts: ${D.tts}   失敗 failed: ${D.fail}\n${D.err.join("\n")||"沒有錯誤 no errors"}\n${navigator.userAgent.replace(/^.*?\) /,"")}`; },500); }
